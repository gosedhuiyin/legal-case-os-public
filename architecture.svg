<rect x="50" y="1365" width="2300" height="180" rx="22" fill="#fffaf2" stroke="#fdba74" stroke-width="2"/>
<text x="76" y="1405" class="section-title">共享底座与离线证明</text>
<rect x="80" y="1417" width="510" height="95" rx="16" fill="#ffffff" stroke="#fdba74" stroke-width="2"/>
<text x="100" y="1451" class="box-title" fill="#10233f">39 个确定性 CLI 命令</text>
<text x="100" y="1482" class="body" fill="#29405f">画像、填充、结构测试、合成、引用和防串案审计</text>
<text x="100" y="1507" class="body" fill="#29405f">机械结果可复核；法律判断仍由律师负责</text>
<rect x="630" y="1417" width="510" height="95" rx="16" fill="#ffffff" stroke="#fdba74" stroke-width="2"/>
<text x="650" y="1451" class="box-title" fill="#10233f">统一 Schema 与政策</text>
