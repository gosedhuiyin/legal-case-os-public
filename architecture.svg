<text x="60" y="56" class="title">个人法律办案操作系统 v1.2.1 · 当前总体架构</text>
<text x="60" y="88" class="subtitle">四块稳定内核：自然语言总控 · 案件状态 · 个人模板学习 · 法源约束下的文书合成</text>
<rect x="1815" y="28" width="525" height="66" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
<text x="1838" y="55" class="box-title" fill="#9a3412">源码已由 Codex 薄入口接入</text>
<text x="1838" y="80" class="small">插件市场包未安装 · 真实案件回放仍待完成</text>
<rect x="50" y="120" width="2300" height="125" rx="22" fill="#fbf7ff" stroke="#d8b4fe" stroke-width="2"/>
<text x="76" y="160" class="section-title">律师责任层 · AI 只形成候选，批准绑定精确对象、版本与范围</text>
<rect x="82" y="172" width="335" height="54" rx="12" fill="#f3e8ff" stroke="#d8b4fe"/>
<text x="98" y="194" class="gate-title">G1 策略</text>
<text x="98" y="216" class="gate-sub">主线、请求/抗辩</text>
<rect x="455" y="172" width="335" height="54" rx="12" fill="#f3e8ff" stroke="#d8b4fe"/>
<text x="471" y="194" class="gate-title">G2 证据</text>
<text x="471" y="216" class="gate-sub">当前提交/备用/内部</text>
<rect x="828" y="172" width="335" height="54" rx="12" fill="#f3e8ff" stroke="#d8b4fe"/>
<text x="844" y="194" class="gate-title">G3 提纲</text>
<text x="844" y="216" class="gate-sub">结构与篇幅预算</text>
<rect x="1201" y="172" width="335" height="54" rx="12" fill="#f3e8ff" stroke="#d8b4fe"/>
<text x="1217" y="194" class="gate-title">MEMORY</text>
<text x="1217" y="216" class="gate-sub">候选→案件正式记录</text>
<rect x="1574" y="172" width="335" height="54" rx="12" fill="#f3e8ff" stroke="#d8b4fe"/>
<text x="1590" y="194" class="gate-title">G4 包快照</text>
<text x="1590" y="216" class="gate-sub">精确版本与包哈希</text>
<rect x="1947" y="172" width="335" height="54" rx="12" fill="#f3e8ff" stroke="#d8b4fe"/>
<text x="1963" y="194" class="gate-title">G5 外部动作</text>
<text x="1963" y="216" class="gate-sub">本版本执行数量为 0</text>
<rect x="50" y="270" width="2300" height="300" rx="22" fill="#ffffff" stroke="#c8d4e3" stroke-width="2"/>
<text x="76" y="310" class="section-title">① 自然语言编译与调度 · 当前原话只生成本轮控制对象，不成为案件事实</text>
<rect x="80" y="335" width="300" height="185" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="100" y="369" class="box-title" fill="#10233f">多平台对话入口</text>
<text x="100" y="400" class="body" fill="#29405f">GPT / Claude / 千问等宿主</text>
<text x="100" y="425" class="body" fill="#29405f">当前用户命令</text>
<text x="100" y="450" class="body" fill="#29405f">材料、引文与无引号正文</text>
<text x="100" y="475" class="body" fill="#29405f">模板参数与文件定位</text>
<text x="100" y="500" class="body" fill="#29405f">对话窗口只是临时工作台</text>
<rect x="420" y="320" width="350" height="215" rx="16" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
<text x="440" y="354" class="box-title" fill="#10233f">分段 + TaskFrame</text>
<text x="440" y="385" class="body" fill="#29405f">命令平面与数据平面隔离</text>
<text x="440" y="410" class="body" fill="#29405f">任务、对象、阶段、范围</text>
<text x="440" y="435" class="body" fill="#29405f">read ACL 与 mutation scope</text>
<text x="440" y="460" class="body" fill="#29405f">证据来源与字段 provenance</text>
<text x="440" y="485" class="body" fill="#29405f">复杂度和展示长度分离</text>
<text x="440" y="510" class="body" fill="#29405f">StylePatch 仅影响本轮</text>
<rect x="810" y="335" width="280" height="185" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
<text x="830" y="369" class="box-title" fill="#10233f">单问澄清门</text>
<text x="830" y="400" class="body" fill="#29405f">先判断能否安全继续</text>
<text x="830" y="425" class="body" fill="#29405f">最多询问一个关键问题</text>
<text x="830" y="450" class="body" fill="#29405f">R3 外部动作提前阻断</text>
<text x="830" y="475" class="body" fill="#29405f">缺范围/来源时停止</text>
<text x="830" y="500" class="body" fill="#29405f">其余歧义使用显式假设</text>
<rect x="1130" y="320" width="320" height="215" rx="16" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
<text x="1150" y="354" class="box-title" fill="#10233f">RunSpec</text>
<text x="1150" y="385" class="body" fill="#29405f">Quick / Standard / Deep / Discuss</text>
<text x="1150" y="410" class="body" fill="#29405f">锁定输入、产物、工具和预算</text>
<text x="1150" y="435" class="body" fill="#29405f">验证器、停止条件和复核点</text>
<text x="1150" y="460" class="body" fill="#29405f">展示简短不降低法律门禁</text>
<text x="1150" y="485" class="body" fill="#29405f">外部动作默认不允许</text>
<text x="1150" y="510" class="body" fill="#29405f">偏好自动学习固定关闭</text>
<rect x="1490" y="320" width="390" height="215" rx="16" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
<text x="1510" y="354" class="box-title" fill="#10233f">IntentEnvelope / FocusContext</text>
<text x="1510" y="385" class="body" fill="#29405f">记忆读：off / file_scoped</text>
<text x="1510" y="410" class="body" fill="#29405f">　　　　relevant / reflect</text>
<text x="1510" y="435" class="body" fill="#29405f">记忆写：none / candidate / commit</text>
<text x="1510" y="460" class="body" fill="#29405f">当前争点、材料与状态版本</text>
<text x="1510" y="485" class="body" fill="#29405f">范围与读取权限分别冻结</text>
<text x="1510" y="510" class="body" fill="#29405f">命令、引文和正文保持隔离</text>
<rect x="1920" y="320" width="395" height="215" rx="20" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
<text x="1940" y="354" class="box-title" fill="#ffffff">薄型总调度</text>
<text x="1940" y="385" class="body" fill="#e8f1ff">读取状态 → 选择一个专业工位</text>
<text x="1940" y="410" class="body" fill="#e8f1ff">校验返回 → 候选或原子回写</text>
<text x="1940" y="435" class="body" fill="#e8f1ff">门禁、缺项、失败或完成时停</text>
<text x="1940" y="460" class="body" fill="#e8f1ff">‘ok’只认唯一未变化对象</text>
<text x="1940" y="485" class="body" fill="#e8f1ff">R3 在工具分配前阻断</text>
<text x="1940" y="510" class="body" fill="#e8f1ff">不在总控中重做专业判断</text>
<path d="M380 427 L420 427" class="flow-blue"/>
<path d="M770 427 L810 427" class="flow-blue"/>
<path d="M1090 427 L1130 427" class="flow-blue"/>
<path d="M1450 427 L1490 427" class="flow-blue"/>
<path d="M1880 427 L1920 427" class="flow-blue"/>
<rect x="50" y="595" width="2300" height="360" rx="22" fill="#fffdf8" stroke="#fdba74" stroke-width="2"/>
<text x="76" y="635" class="section-title">② 案件内状态与有限记忆 · 唯一真值在案件文件夹，聊天和全局产品记忆不承接案情</text>
<rect x="80" y="665" width="460" height="235" rx="16" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
<text x="100" y="699" class="box-title" fill="#10233f">规范状态与来源链</text>
<text x="100" y="730" class="body" fill="#29405f">case-state.json：唯一当前投影</text>
<text x="100" y="755" class="body" fill="#29405f">CaseEvent + audit-log：追加历史</text>
<text x="100" y="780" class="body" fill="#29405f">Source：原件路径、哈希与版本</text>
<text x="100" y="805" class="body" fill="#29405f">Current Case View：可重建短视图</text>
<text x="100" y="830" class="body" fill="#29405f">Context Capsule：本轮临时上下文</text>
<text x="100" y="855" class="body" fill="#29405f">00-originals 永远只读；派生件分层</text>
<rect x="590" y="680" width="360" height="205" rx="16" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
<text x="610" y="714" class="box-title" fill="#10233f">四种读取模式</text>
<text x="610" y="745" class="body" fill="#29405f">off：无案件时默认关闭</text>
<text x="610" y="770" class="body" fill="#29405f">file_scoped：只沿指定来源关系</text>
<text x="610" y="795" class="body" fill="#29405f">relevant：按任务有限召回</text>
<text x="610" y="820" class="body" fill="#29405f">reflect：触发式跨批次反思</text>
<text x="610" y="845" class="body" fill="#29405f">读取永远不授权写入</text>
<rect x="1000" y="680" width="360" height="205" rx="16" fill="#f3e8ff" stroke="#a855f7" stroke-width="2"/>
<text x="1020" y="714" class="box-title" fill="#10233f">三种写入模式</text>
<text x="1020" y="745" class="body" fill="#29405f">none：不形成案件变更</text>
<text x="1020" y="770" class="body" fill="#29405f">candidate：只返回待审 delta</text>
<text x="1020" y="795" class="body" fill="#29405f">commit：版本和批准满足后写回</text>
<text x="1020" y="820" class="body" fill="#29405f">候选不等于事实/证据/策略</text>
<text x="1020" y="845" class="body" fill="#29405f">MemoryDelta 必须可追溯</text>
<rect x="1410" y="680" width="400" height="205" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
<text x="1430" y="714" class="box-title" fill="#10233f">增量与生命周期对象</text>
<text x="1430" y="745" class="body" fill="#29405f">MaterialBatch / TriageCard</text>
<text x="1430" y="770" class="body" fill="#29405f">Deadline / Impact / Prospective Seed</text>
<text x="1430" y="795" class="body" fill="#29405f">WorkflowInstance：跨窗口持久工单</text>
<text x="1430" y="820" class="body" fill="#29405f">RunAttempt：可失败、可重试运行</text>
<text x="1430" y="845" class="body" fill="#29405f">局部失效后复用原有专业工位</text>
<rect x="1860" y="665" width="455" height="235" rx="16" fill="#fff1f2" stroke="#fb7185" stroke-width="2"/>
<text x="1880" y="699" class="box-title" fill="#10233f">多窗口与恢复</text>
<text x="1880" y="730" class="body" fill="#29405f">state_version 拒绝已过期窗口</text>
<text x="1880" y="755" class="body" fill="#29405f">reconcile 只读检查哈希与游标</text>
<text x="1880" y="780" class="body" fill="#29405f">等待事项不依赖聊天窗口存活</text>
<text x="1880" y="805" class="body" fill="#29405f">state 与 audit 中断可被发现</text>
<text x="1880" y="830" class="body" fill="#29405f">跨进程文件锁 + CAS 阻断并发覆盖</text>
<text x="1880" y="855" class="body" fill="#29405f">不做实时全盘扫描或全局长记忆</text>
