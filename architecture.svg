<rect x="750" y="908" width="900" height="34" rx="17" fill="#cffafe"/><text x="1200.0" y="931" class="pill" fill="#10233f" text-anchor="middle">记忆、期限、影响与工单均绑定来源、状态版本和人工门禁</text>
<rect x="50" y="980" width="2300" height="360" rx="22" fill="#ffffff" stroke="#c8d4e3" stroke-width="2"/>
<text x="76" y="1020" class="section-title">③ 个人模板学习与文书合成 · 原模板只读，学习画像、内部控制记录与正式文书分离</text>
<rect x="80" y="1050" width="420" height="235" rx="16" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
<text x="100" y="1084" class="box-title" fill="#10233f">14 个公开 Skill</text>
<text x="100" y="1115" class="body" fill="#29405f">含模板总控与个人模板学习</text>
<text x="100" y="1140" class="body" fill="#29405f">总控 / 预处理 / 入库 / 生命周期</text>
<text x="100" y="1165" class="body" fill="#29405f">案件分析 / 证据门禁 / 法源核验</text>
<text x="100" y="1190" class="body" fill="#29405f">风格范例 / 起草 / 审阅 / 压缩</text>
<text x="100" y="1215" class="body" fill="#29405f">手续组卷与长期工单</text>
<text x="100" y="1240" class="body" fill="#29405f">固定手续模板需本机扩展另行配置</text>
<rect x="550" y="1050" width="460" height="235" rx="16" fill="#ecfdf5" stroke="#22c55e" stroke-width="2"/>
<text x="570" y="1084" class="box-title" fill="#10233f">模板学习与登记</text>
<text x="570" y="1115" class="body" fill="#29405f">候选原件只读 + SHA-256</text>
<text x="570" y="1140" class="body" fill="#29405f">FormProfile：逐格规则与风险字段</text>
<text x="570" y="1165" class="body" fill="#29405f">WritingProfile：版式、结构、语气、论证</text>
<text x="570" y="1190" class="body" fill="#29405f">旧 .doc → 短路径派生 DOCX + 双哈希</text>
<text x="570" y="1215" class="body" fill="#29405f">_profiles 保存画像与渲染基线</text>
<text x="570" y="1240" class="body" fill="#29405f">批准前不得进入正式模板目录</text>
<rect x="1060" y="1050" width="400" height="235" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
<text x="1080" y="1084" class="box-title" fill="#10233f">简单文书 / 手续保真</text>
<text x="1080" y="1115" class="body" fill="#29405f">复制完整 DOCX，不用 Markdown 重做</text>
<text x="1080" y="1140" class="body" fill="#29405f">稳定节点替换 + 受登记结构变换</text>
<text x="1080" y="1165" class="body" fill="#29405f">收费、权限等必须由律师决定</text>
<text x="1080" y="1190" class="body" fill="#29405f">条件不成立留空；签章区 manual_blank</text>
<text x="1080" y="1215" class="body" fill="#29405f">行克隆/正文块仅 TEST-ONLY 验证</text>
<text x="1080" y="1240" class="body" fill="#29405f">原件、页眉页脚和表格几何不动</text>
<rect x="1510" y="1050" width="390" height="235" rx="16" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
<text x="1530" y="1084" class="box-title" fill="#10233f">复杂文书 CompositionSpec</text>
<text x="1530" y="1115" class="body" fill="#29405f">一份版式主模板 + 一份结构主范例</text>
<text x="1530" y="1140" class="body" fill="#29405f">最多三份分段辅助范例</text>
<text x="1530" y="1165" class="body" fill="#29405f">当前事实/证据/法源优先于旧稿</text>
<text x="1530" y="1190" class="body" fill="#29405f">逐命题 ClaimBinding + 不利法源处理</text>
<text x="1530" y="1215" class="body" fill="#29405f">citation audit + exemplar leak check</text>
<text x="1530" y="1240" class="body" fill="#29405f">上游变化自动使计划和成果失效</text>
<rect x="1950" y="1050" width="365" height="235" rx="16" fill="#f3e8ff" stroke="#a855f7" stroke-width="2"/>
<text x="1970" y="1084" class="box-title" fill="#10233f">输出与完成边界</text>
<text x="1970" y="1115" class="body" fill="#29405f">简单案可推进至 G4 候选包</text>
<text x="1970" y="1140" class="body" fill="#29405f">复杂争点单独深析后再合成</text>
<text x="1970" y="1165" class="body" fill="#29405f">独立审阅 → 授权清洁 → 再审</text>
<text x="1970" y="1190" class="body" fill="#29405f">未批准证据/未核验法源为 0</text>
<text x="1970" y="1215" class="body" fill="#29405f">无网络/API 时明确降级或停止</text>
<text x="1970" y="1240" class="body" fill="#29405f">打印/发送/上传/提交为 0</text>
